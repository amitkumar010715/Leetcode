name: Daily LeetCode Solver

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env file from Github Secret
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env

      - name: Run Solver
        run: python daily_leetcode_solver.py

      - name: Send Email Notification
        run: |
          python - << 'EOF'
          import yagmail
          import os

          yag = yagmail.SMTP(
              user=os.environ["EMAIL_HOST_USER"],
              password=os.environ["EMAIL_HOST_PASSWORD"],
              host=os.environ["EMAIL_HOST"],
              port=int(os.environ["EMAIL_PORT"]),
          )

          # Read solution file
          content = "Daily LeetCode Solution is attached."

          yag.send(
              to=os.environ["EMAIL_TO"],
              subject="Your Daily LeetCode Solution",
              contents=[content, 'leet.txt'],
          )

          print("Email sent!")
          EOF
        env:
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Daily LeetCode Solution $(date)" || echo "No changes"
          git push
