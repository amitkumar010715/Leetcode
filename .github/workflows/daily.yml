name: Daily LeetCode Solver

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install yagmail  # Ensure yagmail is installed

      - name: Create .env file from Github Secret
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env

      - name: Run Solver
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python daily_leetcode_solver.py

      - name: Verify Solution File
        run: |
          echo "📁 Checking generated files:"
          ls -la
          if [ -f "leet.txt" ]; then
            echo "✅ leet.txt found!"
            echo "📝 Preview:"
            head -5 leet.txt
          else
            echo "❌ leet.txt not found!"
            exit 1
          fi

      - name: Send Email Notification
        run: |
          python - << 'EOF'
          import yagmail
          import os
          import sys
          
          try:
              print("🚀 Starting email process...")
              
              # Get environment variables
              email_user = os.environ["EMAIL_HOST_USER"]
              email_password = os.environ["EMAIL_HOST_PASSWORD"]
              email_host = os.environ["EMAIL_HOST"]
              email_port = int(os.environ["EMAIL_PORT"])
              email_to = os.environ["EMAIL_TO"]
              
              print(f"📧 Sending from {email_user} to {email_to} via {email_host}:{email_port}")
              
              # FIX: Add proper TLS/SSL configuration
              if email_port == 587:
                  # Use TLS (for Gmail, Outlook, Yahoo)
                  yag = yagmail.SMTP(
                      user=email_user,
                      password=email_password,
                      host=email_host,
                      port=email_port,
                      smtp_starttls=True,  # ← CRITICAL FIX
                      smtp_ssl=False
                  )
              elif email_port == 465:
                  # Use SSL
                  yag = yagmail.SMTP(
                      user=email_user,
                      password=email_password,
                      host=email_host,
                      port=email_port,
                      smtp_starttls=False,
                      smtp_ssl=True
                  )
              else:
                  # Default to TLS
                  yag = yagmail.SMTP(
                      user=email_user,
                      password=email_password,
                      host=email_host,
                      port=email_port,
                      smtp_starttls=True
                  )
              
              print("✅ Connected to email server!")
              
              # Read solution file
              content = "Daily LeetCode Solution is attached."
              
              yag.send(
                  to=email_to,
                  subject="Your Daily LeetCode Solution",
                  contents=[content, 'leet.txt'],
              )
              
              print("🎉 Email sent successfully!")
              
          except Exception as e:
              print(f"💥 Error sending email: {e}")
              sys.exit(1)
          EOF
        env:
          EMAIL_HOST: ${{ secrets.EMAIL_HOST }}
          EMAIL_PORT: ${{ secrets.EMAIL_PORT }}
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "Daily LeetCode Solution $(date +'%Y-%m-%d')"
          git push
