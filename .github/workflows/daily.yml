name: Daily LeetCode Solver

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create .env file from Github Secret
        run: |
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > .env

      - name: Run Solver
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python daily_leetcode_solver.py

      - name: Verify Solution File
        run: |
          if [ -f "leet.txt" ]; then
            echo "✅ leet.txt found!"
          else
            echo "❌ leet.txt not found!"
            exit 1
          fi

      - name: Send Email Notification
        run: |
          python - << 'EOF'
          import smtplib
          import os
          
          try:
              email_user = os.environ["EMAIL_HOST_USER"]
              email_password = os.environ["EMAIL_HOST_PASSWORD"]
              email_to = os.environ["EMAIL_TO"]
              
              server = smtplib.SMTP('smtp.gmail.com', 587)
              server.starttls()
              server.login(email_user, email_password)
              
              with open('leet.txt', 'r') as f:
                  solution = f.read()
              
              body = f"Subject: Your Daily LeetCode Solution\n\n{solution}"
              server.sendmail(email_user, email_to, body)
              server.quit()
              
              print("✅ Email sent successfully!")
              
          except Exception as e:
              print(f"❌ Error: {e}")
              exit(1)
          EOF
        env:
          EMAIL_HOST_USER: ${{ secrets.EMAIL_HOST_USER }}
          EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "Daily LeetCode Solution $(date +'%Y-%m-%d')"
          git push
